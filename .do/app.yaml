# DigitalOcean App Platform spec for Sunday Peak.
# Builds on DO's servers (Node buildpack, no Docker) and redeploys on every push to master.
name: sundaypeak
static_sites:
  - name: mountains
    github:
      repo: amaclean2/SundayPeak
      branch: master
      deploy_on_push: true
    source_dir: mountains
    # Force the Node buildpack so App Platform ignores mountains/Dockerfile.
    environment_slug: node-js
    build_command: npm run build
    output_dir: build
    # Single-page app: serve index.html for client-side routes (react-router).
    catchall_document: index.html
    envs:
      # GitHub token with read:packages, used by mountains/.npmrc to install
      # @amaclean2/sundaypeak-treewells from GitHub Packages. Set the value in the DO dashboard.
      - key: NPM_TOKEN
        scope: BUILD_TIME
        type: SECRET
# Add once the app is verified on its .ondigitalocean.app URL:
# domains:
#   - domain: sundaypeak.com
#     type: PRIMARY
#   - domain: www.sundaypeak.com
#     type: ALIAS
