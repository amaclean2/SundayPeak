# DigitalOcean App Platform spec for Sunday Peak.
# Builds on DO's servers (Node buildpack, no Docker) and redeploys on every push to master.
name: sundaypeak
static_sites:
  - name: mountains
    github:
      repo: amaclean2/SundayPeak
      branch: master
      deploy_on_push: true
    source_dir: mountains
    # Force the Node buildpack so App Platform ignores mountains/Dockerfile.
    environment_slug: node-js
    build_command: npm run build
    output_dir: build
    # Single-page app: serve index.html for client-side routes (react-router).
    catchall_document: index.html
domains:
  - domain: sundaypeak.com
    type: PRIMARY
  - domain: www.sundaypeak.com
    type: ALIAS
